name: Deployment Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Daily rebuild: security patches should not wait for a weekly slot.
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: deployment-verification-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Authenticated requests avoid the anonymous API rate limit that shared
  # GitHub runners regularly hit (api.github.com answers 403 otherwise).
  GH_API_TOKEN: ${{ github.token }}

jobs:
  lint:
    name: Lint shell scripts and workflow YAML
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ShellCheck
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            koalaman/shellcheck-alpine:stable \
            shellcheck ./*.sh

      - name: actionlint (GitHub Actions workflow linting)
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            rhysd/actionlint:1.7.12 \
            -color

  scan-trivy:
    name: Scan pinned upstream image with Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      # Image refs are read from the compose file's x-images defaults at
      # runtime — single source of truth.
      fail-fast: false
      matrix:
        include:
          - name: jellyfin
            env_var: JELLYFIN_IMAGE_TAG
          - name: backups
            env_var: JELLYFIN_BACKUPS_IMAGE_TAG
          - name: traefik
            env_var: TRAEFIK_IMAGE_TAG
          - name: orphans
            env_var: JELLYFIN_ORPHANS_IMAGE_TAG

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned ${{ matrix.name }} image from the compose file
        id: pin
        env:
          ENV_VAR: ${{ matrix.env_var }}
        run: |
          image="$(grep -m1 -oE "\\$\\{${ENV_VAR}:-.*" jellyfin-traefik-letsencrypt-docker-compose.yml | sed -E -e ':a' -e 's/\$\{[A-Z0-9_]+:-([^{}]*)\}/\1/' -e 'ta')"
          if [ -z "$image" ]; then
            echo "${ENV_VAR} default not found in the compose x-images block" >&2
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Trivy scan of ${{ matrix.name }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.pin.outputs.image }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # FINDINGS DO NOT FAIL THIS STEP; A SCAN THAT CANNOT FINISH DOES.
          # Stated here rather than left to the action's default, because
          # this job no longer carries continue-on-error and the difference
          # now decides whether a red run means a new CVE upstream or a
          # scanner that died before it could report one.
          exit-code: "0"

      - name: Upload Trivy SARIF (${{ matrix.name }}) to GitHub Security
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}

  deploy-and-test:
    name: docker compose up + Jellyfin HTTPS smoke + backup validity
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 35
    permissions:
      contents: read

    env:
      NETWORK_ONE: jellyfin-network
      NETWORK_TWO: traefik-network
      DOCKER_COMPOSE_FILE: jellyfin-traefik-letsencrypt-docker-compose.yml
      APP_HOSTNAME: jellyfin.heyvaldemardm.net
      APP_TRAEFIK_HOSTNAME: traefik.jellyfin.heyvaldemardm.net
      COMPOSE_PROJECT_NAME: jellyfin

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create necessary Docker networks
        run: |
          docker network create "$NETWORK_ONE" || true
          docker network create "$NETWORK_TWO" || true

      - name: Generate test .env with ephemeral credentials
        # The real .env is gitignored. CI generates throwaway credentials so
        # `docker compose up` succeeds without committing secrets to the
        # repo. No *_IMAGE_TAG values on purpose: the compose file's
        # x-images defaults apply, so CI always tests exactly the pins the
        # template ships to users who run it unmodified.
        run: |
          cat > .env <<EOF
          TRAEFIK_ACME_EMAIL=ci@example.com
          TRAEFIK_HOSTNAME=${APP_TRAEFIK_HOSTNAME}
          TRAEFIK_BASIC_AUTH=traefikadmin:\$\$2y\$\$10\$\$sMzJfirKC75x/hVpiINeZOiSm.Jkity9cn4KwNkRvO7hSQVFc5FLO
          JELLYFIN_HOSTNAME=${APP_HOSTNAME}
          BACKUP_INIT_SLEEP=15s
          BACKUP_INTERVAL=60s
          EOF
          # The media mount defaults to ./media; CI has no library, and an
          # empty directory is the honest stand-in - it proves the mount works
          # without pretending there is content to scan.
          mkdir -p media
          echo "Generated ephemeral .env for CI run"

      - name: Upgrade drill — the previous release comes up first, on the volumes this run will upgrade
        # A fresh stack proves the new image starts. It proves nothing about the
        # data a deployed host already has: whether the new database image accepts
        # the old data directory, whether the application's migrations run on a
        # populated schema. So the previous release is started first, on this
        # project's volumes, and the ordinary `up -d` below then recreates the
        # changed containers on top of it - which is exactly what `git pull &&
        # docker compose up -d` does on a deployed host. Every smoke check that
        # follows judges the upgraded stack, not a fresh one.
        run: |
          prev="$(git ls-remote --tags --sort=-v:refname origin 'v*' | grep -v '\^{}' | head -1 | sed 's|.*refs/tags/||')"
          if [ -z "$prev" ]; then
            echo "no previous release: nothing to upgrade from, the fresh start below is the whole test"
            exit 0
          fi
          git fetch --depth=1 --quiet origin "refs/tags/$prev:refs/tags/$prev"
          if git diff --quiet "$prev" -- "$DOCKER_COMPOSE_FILE"; then
            echo "the compose file is unchanged since $prev: nothing to drill"
            exit 0
          fi
          git show "$prev:$DOCKER_COMPOSE_FILE" > .upgrade-drill-previous.yml
          echo "starting $prev on this project's volumes"
          docker compose -f .upgrade-drill-previous.yml -p "$COMPOSE_PROJECT_NAME" up -d
          # Healthy means: every container is running and healthy (or running
          # with no health check), or exited 0 (a one-shot init container).
          bad=""
          for _ in $(seq 1 60); do
            bad="$(docker compose -f .upgrade-drill-previous.yml -p "$COMPOSE_PROJECT_NAME" ps -a --format json \
              | jq -rs '[.[] | select((.State == "running" and (.Health == "" or .Health == "healthy")) or (.State == "exited" and .ExitCode == 0) | not)] | map("\(.Service):\(.State)/\(.Health)") | join(" ")')"
            [ -z "$bad" ] && break
            sleep 10
          done
          if [ -n "$bad" ]; then
            echo "::error::the previous release ($prev) did not come up with this run's .env: $bad. Either the variable contract changed - then the changelog must say so - or $prev was never green here."
            docker compose -f .upgrade-drill-previous.yml -p "$COMPOSE_PROJECT_NAME" logs --tail 80
            exit 1
          fi
          echo "$prev is up and healthy; stopping it and keeping its volumes"
          docker compose -f .upgrade-drill-previous.yml -p "$COMPOSE_PROJECT_NAME" down
          rm -f .upgrade-drill-previous.yml
          echo "the start below is now an upgrade from $prev"

      - name: Start up services using Docker Compose
        run: docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" up -d

      - name: Modify /etc/hosts for internal routing
        run: |
          echo "127.0.0.1 $APP_HOSTNAME" | sudo tee -a /etc/hosts
          echo "127.0.0.1 $APP_TRAEFIK_HOSTNAME" | sudo tee -a /etc/hosts

      - name: Print Docker Compose services status
        run: docker ps

      - name: Wait for Jellyfin through Traefik
        # /System/Info/Public is what the dashboard asks before it renders
        # anything, and it answers with the setup state rather than merely a
        # status code. A fresh deployment says {"type":"setup-database"}: that
        # is the whole chain working - Traefik, the certificate, the container,
        # and the application having opened its data directory.
        run: |
          # shellcheck disable=SC2016
          timeout 8m bash -c 'while ! curl -sk "https://$APP_HOSTNAME/System/Info/Public" | grep -q "\"Version\""; do
            echo "Waiting for Jellyfin..."
            sleep 10
          done'
          curl -sk "https://$APP_HOSTNAME/System/Info/Public" -w "\n"
          curl -skL -o /dev/null -w "Jellyfin UI: %{http_code}\n" "https://$APP_HOSTNAME/"

      - name: Verify a backup is produced and valid
        # Log-driven: the file named in a 'backup OK' line has already been
        # read back by the loop itself, so this never races a cycle that is
        # still writing.
        run: |
          # shellcheck disable=SC2016
          timeout 6m bash -c 'until docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" logs backups 2>/dev/null | grep -q "Data backup OK"; do echo "Waiting for the first backup cycle..."; sleep 10; done'
          data=$(docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" logs backups 2>/dev/null | grep "Data backup OK" | tail -1 | sed -E 's/.*Data backup OK: ([^ ]+) .*/\1/')
          [ -n "$data" ] || { echo "::error::no 'Data backup OK' line - the archive failed"; exit 1; }
          echo "Data backup file: $data"
          docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" exec -T backups sh -c "tar -tzf '$data' > /dev/null && tar -tzf '$data' | grep -q '^config/'" \
            && echo "Data backup valid and carries the data directory: $data"
          docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" logs backups 2>/dev/null | grep -i "backup FAILED" && { echo "::error::the backups log reports a failure"; exit 1; } || true

      - name: Run the backup/restore end-to-end tests
        # Eight scenarios against the live stack: required-env guard, backup
        # produced, readable, valid content, library archive readable, failure
        # detected when the database is down, restore genuinely replaces state,
        # prune keeps recent files. Same script a maintainer runs locally.
        run: |
          chmod +x tests/e2e-backup-restore.sh
          ./tests/e2e-backup-restore.sh

      - name: Jellyfin answers on the restored data directory
        # The end-to-end test above empties the data directory and unpacks an
        # archive over it while the container is stopped. A restore that leaves
        # the SQLite file in a state the application rejects passes every check
        # up to here and fails the first time somebody actually needs it.
        run: |
          docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" restart jellyfin
          # shellcheck disable=SC2016
          timeout 6m bash -c 'while ! curl -sk "https://$APP_HOSTNAME/System/Info/Public" | grep -q "\"Version\""; do
            echo "Waiting for Jellyfin on the restored data..."
            sleep 10
          done'
          echo "Jellyfin came back on the restored data directory"

      - name: Run the orphan-cleanup end-to-end tests
        # Builds a library on real video, then produces an orphan the way a
        # library really produces one - a root that moves away and never comes
        # back under that path - and proves the rows survive a scan, a restart
        # and another scan before the tool is allowed anywhere near them. Then
        # both refusals, the removal across cascading and non-cascading tables,
        # and Jellyfin coming back up on the edited database.
        run: |
          chmod +x tests/e2e-orphan-cleanup.sh jellyfin-drop-orphans.sh
          ./tests/e2e-orphan-cleanup.sh

      - name: Wait for the Traefik dashboard to be ready
        run: |
          # shellcheck disable=SC2016
          timeout 5m bash -c 'while ! curl -fsSLk --write-out "%{http_code}" --output /dev/null "https://$APP_TRAEFIK_HOSTNAME" | grep -E "200|401"; do
            echo "Waiting for the dashboard to be ready..."
            sleep 10
          done'

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" logs

      - name: Shutdown Docker Compose services
        if: always()
        run: docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" down
